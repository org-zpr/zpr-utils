[package]
name = "rcu"
version = "0.1.0"
edition = "2024"

[dependencies]
aarc = { version = "0.4.0", optional = true }
arc-swap = { version = "1.7", optional = true }
crossbeam-epoch = { version = "0.9.18", optional = true }
cslab = { git = "https://github.com/org-zpr/zpr-utils.git", tag = "cslab-v0.1.2" }

[features]
default = ["rcu-crossbeam-epoch"]
rcu-aarc = ["dep:aarc"]
rcu-arc-swap = ["dep:arc-swap"]
rcu-crossbeam-epoch = ["dep:crossbeam-epoch"]
rcu-mutex-arc = []
rcu-rwlock = []